[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wanderra-os"
version = "0.1.0"
description = "The foundation for Wanderra OS, an AI-native operating system."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Wanderra" }]
dependencies = [
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "fastapi>=0.115,<1.0",
    "cryptography>=44,<46",
    "google-api-python-client>=2.0,<3.0",
    "google-auth>=2.0,<3.0",
    "google-auth-oauthlib>=1.2,<2.0",
    "google-cloud-kms>=3.16,<4.0",
    "openai>=1.0,<2.0",
    "pypdf>=5.0,<7.0",
    "pydantic-settings>=2.7,<3.0",
    "python-docx>=1.1,<2.0",
    "python-multipart>=0.0.20,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "ruff>=0.9,<1.0",
]

[project.scripts]
wanderra-setup = "app.setup:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
